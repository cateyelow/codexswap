[build-system]
# PEP 639 `license = "MIT"` needs hatchling 1.27 or newer.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "codexswap"
dynamic = ["version"]
description = "Multi-account switcher and banked rate-limit reset manager for OpenAI Codex CLI"
readme = "README.md"
# PEP 639: an SPDX expression, not the file inlined into a metadata header.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "cateyelow" }]
requires-python = ">=3.9"
keywords = ["codex", "openai", "cli", "account", "switcher", "rate-limit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
dependencies = []

[project.scripts]
codexswap = "codexswap.cli:main"
cxswap = "codexswap.cli:main"

[project.urls]
Homepage = "https://github.com/cateyelow/codexswap"
Issues = "https://github.com/cateyelow/codexswap/issues"

[project.optional-dependencies]
# ruff is pinned to a minor range on purpose: its rule codes get split and renamed
# between minors (UP007 became UP007 + UP045 in 0.16), which silently turns a clean
# local run into a red CI run.
dev = ["pytest>=7.0", "ruff>=0.16,<0.17"]

[tool.hatch.version]
path = "src/codexswap/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/codexswap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# UP006/UP007/UP045/UP035: we deliberately keep typing.Optional / typing.List rather
# than PEP 585 and PEP 604 syntax. Every module uses `from __future__ import
# annotations`, so both forms are valid in annotations, but the typing.* spelling also
# stays correct in the runtime-evaluated positions this codebase uses on Python 3.9.
# These codes match the pinned ruff minor; see the dev extra above.
ignore = ["E501", "UP006", "UP007", "UP045", "UP035"]
