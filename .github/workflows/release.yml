# Configure PyPI Trusted Publishing before the first release:
# owner cateyelow, repository codexswap, workflow release.yml, environment pypi.
name: Release

"on":
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Publishing is irreversible: a version number can never be reused on PyPI. So the
  # tag runs the same checks CI runs, and the upload waits for them.
  checks:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
        exclude:
          - os: macos-latest
            python-version: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/codexswap
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Refuse a tag that does not name the version being published
        shell: bash
        run: |
          version=$(PYTHONPATH=src python -c "import codexswap; print(codexswap.__version__)")
          echo "tag=$GITHUB_REF_NAME package=$version"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Install build tooling
        run: pip install build
      - name: Build distributions
        run: python -m build
      - name: Check the distributions before uploading them
        run: |
          # twine below 6.1 rejects Metadata-Version 2.4+, which PEP 639 metadata is.
          pip install "twine>=6.1"
          python -m twine check --strict dist/*
      - name: Run the built wheel before uploading it
        env:
          CODEXSWAP_HOME: ${{ runner.temp }}/codexswap-release
          CODEX_HOME: ${{ runner.temp }}/codex-release
        # The last gate before an upload that can never be taken back: run what the
        # user will actually install, from outside the checkout.
        run: |
          python -m venv "${{ runner.temp }}/relenv"
          "${{ runner.temp }}/relenv/bin/pip" install --no-index --no-deps dist/*.whl
          cd "${{ runner.temp }}"
          "${{ runner.temp }}/relenv/bin/codexswap" version
          "${{ runner.temp }}/relenv/bin/codexswap" list --no-probe
          "${{ runner.temp }}/relenv/bin/cxswap" config
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
