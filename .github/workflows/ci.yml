name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          # setup-python has no arm64 macOS build for 3.9, and the Intel macos-13
          # runner queues for hours, which leaves the whole run pending. Python 3.9
          # stays covered on ubuntu-latest and windows-latest.
          - os: macos-latest
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Smoke test the installed console script
        env:
          CODEXSWAP_HOME: ${{ runner.temp }}/codexswap-smoke
          CODEX_HOME: ${{ runner.temp }}/codex-smoke
        run: |
          codexswap --help
          codexswap version
          codexswap list --no-probe
          codexswap config

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tooling
        run: pip install build
      - name: Build distributions
        run: python -m build
      - name: Check distribution metadata
        # Catch a metadata regression on the pull request, not on the release tag
        # where the version number has already been burned.
        run: |
          pip install "twine>=6.1"
          python -m twine check --strict dist/*
      - name: Smoke test the built wheel, outside the checkout
        env:
          CODEXSWAP_HOME: ${{ runner.temp }}/codexswap-wheel
          CODEX_HOME: ${{ runner.temp }}/codex-wheel
        # The matrix installs the checkout, so it would still pass if a module went
        # missing from the wheel. This installs what users actually get.
        run: |
          python -m venv "${{ runner.temp }}/wheelenv"
          "${{ runner.temp }}/wheelenv/bin/pip" install --no-index --no-deps dist/*.whl
          cd "${{ runner.temp }}"
          "${{ runner.temp }}/wheelenv/bin/codexswap" --help
          "${{ runner.temp }}/wheelenv/bin/codexswap" version
          "${{ runner.temp }}/wheelenv/bin/codexswap" list --no-probe
          "${{ runner.temp }}/wheelenv/bin/cxswap" config
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
